name: 'TC-06 noise 5 ms during critical operation'
version: 1
author: 'Vitalii Kostianets'

steps:
  - delay: 2s
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 300ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 50ms
  - set-control:
      part-id: noise
      control: pressed
      value: 1
  - delay: 5ms
  - set-control:
      part-id: noise
      control: pressed
      value: 0
  - delay: 1500ms
